name: Build VibeCut Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify or Build APK
        run: |
          if [ -f "VibeCut-Pro.apk" ]; then
            echo "Found pre-compiled signed VibeCut-Pro.apk from AI Studio."
            mkdir -p app/build/outputs/apk/debug
            cp VibeCut-Pro.apk app/build/outputs/apk/debug/app-debug.apk
          else
            echo "VibeCut-Pro.apk not found at root."
            exit 1
          fi

      - name: Upload VibeCut APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeCut-Pro-Installable-APK
          path: VibeCut-Pro.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "VibeCut Pro Android APK (Bản cài đặt điện thoại)"
          body: "Bấm trực tiếp vào file **VibeCut-Pro.apk** bên dưới để tải về và cài đặt trên điện thoại Android của bạn."
          files: VibeCut-Pro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
